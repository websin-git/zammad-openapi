name: Validate OpenAPI

on:
  push:
    paths:
      - openapi.yaml
      - .redocly.yaml
      - .github/workflows/openapi.yml
  pull_request:
    paths:
      - openapi.yaml
      - .redocly.yaml
      - .github/workflows/openapi.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6

      - name: Lint with Redocly
        run: >-
          docker run --rm
          -v "$PWD:/spec"
          redocly/cli:2.43.1
          lint /spec/openapi.yaml
          --config /spec/.redocly.yaml

      - name: Validate with OpenAPI Generator
        run: >-
          docker run --rm
          -v "$PWD:/local"
          openapitools/openapi-generator-cli:v7.22.0
          validate -i /local/openapi.yaml

      - name: Smoke-test TypeScript client generation
        run: >-
          docker run --rm
          -v "$PWD:/local"
          -v "${{ runner.temp }}:/generated"
          openapitools/openapi-generator-cli:v7.22.0
          generate
          -i /local/openapi.yaml
          -g typescript-fetch
          -o /generated/typescript-fetch

      - name: Compile generated TypeScript client
        run: >-
          docker run --rm
          -v "${{ runner.temp }}/typescript-fetch:/client"
          -w /client
          node:24-alpine
          npx --yes -p typescript@5.9.3
          tsc --noEmit --target ES2020 --module commonjs --strict index.ts

      - name: Smoke-test Postman conversion
        run: >-
          docker run --rm
          -v "$PWD:/work"
          -v "${{ runner.temp }}:/generated"
          -w /work
          node:24-alpine
          npx --yes openapi-to-postmanv2@6.3.1
          -s openapi.yaml
          -o /generated/zammad.postman_collection.json
          -p
          -O folderStrategy=Tags,includeAuthInfoInExample=true
