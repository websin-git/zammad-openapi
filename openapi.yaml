openapi: 3.0.3
info:
  title: Zammad REST API
  version: 7.1.1
  description: |-
    Community-maintained OpenAPI description for the public Zammad REST and integration APIs, verified against the official Zammad 7.1.1 documentation and source tag. Zammad installations can add custom Object Manager attributes; affected schemas therefore allow additional properties.

    The three global authentication entries are alternatives. For `zammadToken`, send the exact header value `Authorization: Token token=<access-token>`.
  contact:
    name: Zammad community
    url: https://community.zammad.org/
servers:
  - url: '{scheme}://{fqdn}'
    description: A Zammad instance.
    variables:
      scheme:
        default: https
        enum:
          - https
          - http
      fqdn:
        default: zammad.example.com
        description: Hostname, optionally including a port.
security:
  - zammadToken: []
  - oauth2Bearer: []
  - basicAuth: []
tags:
  - name: Search
    description: Endpoint-specific and global search.
  - name: Calendars
    description: Business-hour calendars and public holidays.
  - name: Checklists
    description: Ticket checklists.
  - name: Checklist Items
    description: Items contained in ticket checklists.
  - name: Checklist Templates
    description: Reusable checklist templates.
  - name: CTI
    description: Generic CTI integration events.
  - name: Groups
    description: Ticket groups and group settings.
  - name: Knowledge Base
    description: Knowledge Base initialization, settings, and permissions.
  - name: Knowledge Base Answers
    description: Knowledge Base answers and publications.
  - name: Knowledge Base Categories
    description: Knowledge Base category trees.
  - name: Links
    description: Links between tickets and supported objects.
  - name: Mentions
    description: Ticket mention subscriptions.
  - name: Monitoring
    description: Health and operational monitoring endpoints.
  - name: Object Manager
    description: Custom object attributes and schema migrations.
  - name: Online Notifications
    description: Notifications for the authenticated user.
  - name: Organizations
    description: Customer organizations and memberships.
  - name: Roles
    description: Roles, permissions, and group access.
  - name: SLAs
    description: Service-level agreement rules and targets.
  - name: Tags
    description: Ticket tag assignments and tag administration.
  - name: Ticket Articles
    description: Ticket conversations and attachments.
  - name: Ticket Priorities
    description: Ticket priority configuration.
  - name: Ticket States
    description: Ticket state configuration.
  - name: Tickets
    description: Tickets and their lifecycle.
  - name: Ticket Shared Drafts
    description: Shared agent drafts for tickets.
  - name: Ticket Summary
    description: AI-assisted ticket summaries.
  - name: Time Accounting
    description: Time entries attached to tickets.
  - name: User Access Tokens
    description: Personal API access tokens.
  - name: Users
    description: Users and data privacy deletion tasks.
externalDocs:
  description: Official Zammad REST API documentation
  url: https://docs.zammad.org/en/latest/api/intro.html
paths:
  /api/v1/groups/search:
    parameters:
      - $ref: '#/components/parameters/From'
    get:
      tags:
        - Groups
      summary: Search groups
      operationId: searchGroups
      responses:
        '200':
          description: Successful response.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/Group'
                  - $ref: '#/components/schemas/GroupSearchWithTotalCountResult'
                  - $ref: '#/components/schemas/FullSearchResult'
                  - $ref: '#/components/schemas/TotalCountResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        default:
          $ref: '#/components/responses/UnexpectedError'
      description: Search by a UTF-8 query. Response shape depends on `full`, `expand`, `with_total_count`, and `only_total_count`.
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Expand'
        - $ref: '#/components/parameters/Full'
        - $ref: '#/components/parameters/WithTotalCount'
        - $ref: '#/components/parameters/OnlyTotalCount'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/OrderBy'
      x-zammad-permissions:
        - admin.group
    post:
      tags:
        - Groups
      summary: Search groups by condition
      operationId: searchGroupsByCondition
      responses:
        '200':
          description: Successful response.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/Group'
                  - $ref: '#/components/schemas/GroupSearchWithTotalCountResult'
                  - $ref: '#/components/schemas/FullSearchResult'
                  - $ref: '#/components/schemas/TotalCountResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        default:
          $ref: '#/components/responses/UnexpectedError'
      description: Condition-based search using the same condition format as Zammad triggers and overviews.
      parameters:
        - $ref: '#/components/parameters/Expand'
        - $ref: '#/components/parameters/Full'
        - $ref: '#/components/parameters/WithTotalCount'
        - $ref: '#/components/parameters/OnlyTotalCount'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      requestBody:
