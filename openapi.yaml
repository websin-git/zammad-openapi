components:
  securitySchemes:
    zammadToken:
      type: apiKey
      in: header
      name: Authorization
      description: Zammad access token. Enter the complete value `Token token=<access-token>`.
    oauth2Bearer:
      type: http
      scheme: bearer
      bearerFormat: OAuth 2.0
      description: OAuth2 access token issued by the Zammad instance.
    basicAuth:
      type: http
      scheme: basic
      description: Username and password. This method can be disabled, does not work with 2FA, and is not recommended.
    monitoringToken:
      type: apiKey
      in: query
      name: token
      description: Monitoring API token configured by the instance.
  parameters:
    From:
      name: From
      in: header
      required: false
      description: Act on behalf of another user. Accepts user ID, login, or email and requires `admin.user`.
      schema:
        type: string
    Expand:
      name: expand
      in: query
      required: false
      description: Include resolved relation names in the response.
      schema:
        type: boolean
        default: false
    Page:
      name: page
      in: query
      required: false
      description: One-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      description: Requested page size. Zammad silently caps values at a controller-specific hard limit.
      schema:
        type: integer
        minimum: 1
    Query:
      name: query
      in: query
      required: true
      description: UTF-8 search expression.
      schema:
        type: string
        minLength: 1
    SortBy:
      name: sort_by
      in: query
      required: false
      description: Response field used for sorting.
      schema:
        type: string
    OrderBy:
      name: order_by
      in: query
      required: false
      description: Sort direction.
      schema:
        type: string
        enum:
          - asc
          - desc
    Full:
      name: full
      in: query
      required: false
      description: Return record IDs and related assets.
      schema:
        type: boolean
        default: false
    WithTotalCount:
      name: with_total_count
      in: query
      required: false
      description: Include total result count.
      schema:
        type: boolean
        default: false
    OnlyTotalCount:
      name: only_total_count
      in: query
      required: false
      description: Return only the total result count.
      schema:
        type: boolean
        default: false
  headers:
    CacheControl:
      description: Zammad API responses are not cached.
      schema:
        type: string
        example: no-store
    XFailure:
      description: Authentication or authorization failure detail.
      schema:
        type: string
  responses:
    Unauthorized:
      description: Credentials are invalid or expired.
      headers:
        X-Failure:
          $ref: '#/components/headers/XFailure'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authentication is missing or the user lacks permission.
      headers:
        X-Failure:
          $ref: '#/components/headers/XFailure'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableContent:
      description: Validation or request semantics failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnexpectedError:
      description: Unexpected error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    EmptyObject:
      type: object
      properties: {}
      additionalProperties: false
      description: An empty JSON object.
    DynamicObject:
      type: object
      properties: {}
      additionalProperties: true
      description: An installation-dependent JSON object.
    NumericIdentifier:
      oneOf:
        - type: integer
          format: int64
          minimum: 1
        - type: string
          pattern: ^\d+$
      description: A positive numeric ID as an integer or string.
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        error_human:
          type: string
        invalid_attribute:
          type: object
          properties: {}
          additionalProperties:
            type: string
        unprocessable_content: {}
        invalid_csrf_token:
          type: boolean
      additionalProperties: true
      description: Central Zammad error envelope. Specialized controllers may add further fields.
      required:
        - error
    AttachmentUpload:
      type: object
      properties:
        filename:
          type: string
          minLength: 1
        data:
          type: string
          format: byte
          description: Base64-encoded file content.
        mime-type:
          type: string
          minLength: 1
          description: MIME type. The property name contains a hyphen.
      additionalProperties: false
      required:
        - filename
        - data
        - mime-type
    Attachment:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        filename:
          type: string
        size:
          type: string
          nullable: true
        preferences:
          type: object
          properties: {}
          additionalProperties: true
        url:
          type: string
          readOnly: true
        preview_url:
          type: string
          readOnly: true
          nullable: true
      additionalProperties: true
      required:
        - id
        - filename
    Permission:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
        note:
          type: string
          nullable: true
        preferences:
          type: object
          properties: {}
          additionalProperties: true
        active:
          type: boolean
        allow_signup:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      additionalProperties: true
      required:
        - id
        - name
    TotalCountResult:
      type: object
      properties:
        total_count:
          type: integer
          format: int64
          minimum: 0
      additionalProperties: false
      required:
        - total_count
    GenericSearchRecord:
      type: object
      properties:
        id:
          oneOf:
            - type: integer
              format: int64
            - type: string
        name:
          type: string
        title:
          type: string
      additionalProperties: true
      description: Installation-dependent record returned by a source-confirmed search endpoint whose resource contract is not public.
    GenericSearchWithTotalCountResult:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/GenericSearchRecord'
        total_count:
          type: integer
          format: int64
          minimum: 0
      additionalProperties: true
      required:
        - records
        - total_count
    FullSearchResult:
      type: object
      properties:
        record_ids:
          type: array
          items:
            type: integer
            format: int64
        assets:
          type: object
          properties: {}
          additionalProperties:
            type: object
            properties: {}
            additionalProperties: true
        total_count:
          type: integer
          format: int64
          minimum: 0
      additionalProperties: true
      description: Search envelope returned with `full=true`.
      required:
        - record_ids
        - assets
        - total_count
    ConditionSearchRequest:
      type: object
      properties:
        condition:
          type: object
          properties: {}
          additionalProperties:
            type: object
            properties:
              operator:
                type: string
              value: {}
            additionalProperties: true
            required:
              - operator
              - value
        sort_by:
          type: string
        order_by:
          type: string
          enum:
            - asc
            - desc
            - ASC
            - DESC
      additionalProperties: true
      required:
        - condition
    GenericSearchResult:
      oneOf:
        - type: array
          items:
            $ref: '#/components/schemas/GenericSearchRecord'
        - $ref: '#/components/schemas/GenericSearchWithTotalCountResult'
        - $ref: '#/components/schemas/FullSearchResult'
        - $ref: '#/components/schemas/TotalCountResult'
    GlobalSearchResult:
      type: object
      properties:
        assets:
          type: object
          properties: {}
          additionalProperties:
            type: object
            properties: {}
            additionalProperties: true
        result:
          type: array
          items:
            $ref: '#/components/schemas/DynamicObject'
        total_count:
          type: integer
          format: int64
          minimum: 0
      additionalProperties: true
    BusinessHoursDay:
      type: object
      properties:
        active:
          type: boolean
        timeframes:
          type: array
          items:
            type: array
            items:
              type: string
              pattern: ^\d{2}:\d{2}$
              example: '09:00'
            minItems: 2
            maxItems: 2
      additionalProperties: false
      required:
        - active
        - timeframes
    BusinessHours:
      type: object
      properties:
        mon:
          $ref: '#/components/schemas/BusinessHoursDay'
        tue:
          $ref: '#/components/schemas/BusinessHoursDay'
        wed:
          $ref: '#/components/schemas/BusinessHoursDay'
        thu:
          $ref: '#/components/schemas/BusinessHoursDay'
        fri:
          $ref: '#/components/schemas/BusinessHoursDay'
        sat:
